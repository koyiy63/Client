<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>3D Cube Simulator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>3D Cube Simulator</h1>
            <p>Interactive 3D cube with touch and mouse controls</p>
        </header>
        
        <div class="controls">
            <div class="control-group">
                <label for="material-select">Material:</label>
                <select id="material-select">
                    <option value="basic">Basic</option>
                    <option value="metal">Metal</option>
                    <option value="glass">Glass</option>
                    <option value="wood">Wood</option>
                    <option value="neon">Neon</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="rotation-speed">Rotation Speed:</label>
                <input type="range" id="rotation-speed" min="0" max="2" step="0.1" value="0">
                <span id="speed-value">0</span>
            </div>
            
            <div class="control-group">
                <button id="reset-btn">Reset View</button>
                <button id="fullscreen-btn">Fullscreen</button>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="cube-canvas"></canvas>
            <div class="instructions">
                <div class="instruction-item">
                    <span class="icon">🖱️</span>
                    <span>Desktop: Drag to rotate, scroll to zoom</span>
                </div>
                <div class="instruction-item">
                    <span class="icon">👆</span>
                    <span>Mobile: Swipe to rotate, pinch to zoom</span>
                </div>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">FPS:</span>
                <span id="fps-counter">60</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Vertices:</span>
                <span id="vertex-count">24</span>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>

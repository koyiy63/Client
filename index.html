<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Cube Simulator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#764ba2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CubeSim">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="container">
        <div id="canvas-container">
            <canvas id="cube-canvas"></canvas>
        </div>
        
        <div id="controls-panel">
            <div class="control-group">
                <h3>Cube Controls</h3>
                <button id="reset-cube" class="btn">Reset Cube</button>
                <button id="random-rotate" class="btn">Random Rotate</button>
                <button id="solve-cube" class="btn">Solve Cube</button>
            </div>
            
            <div class="control-group">
                <h3>Camera Controls</h3>
                <button id="reset-camera" class="btn">Reset Camera</button>
                <button id="top-view" class="btn">Top View</button>
                <button id="front-view" class="btn">Front View</button>
            </div>
            
            <div class="control-group">
                <h3>Appearance</h3>
                <label for="cube-size">Cube Size:</label>
                <input type="range" id="cube-size" min="0.5" max="2" step="0.1" value="1">
                
                <label for="rotation-speed">Rotation Speed:</label>
                <input type="range" id="rotation-speed" min="0.1" max="5" step="0.1" value="1">
                
                <label for="wireframe-toggle">Wireframe:</label>
                <input type="checkbox" id="wireframe-toggle">
            </div>
            
            <div class="control-group">
                <h3>Touch Instructions</h3>
                <p>• Drag to rotate camera</p>
                <p>• Pinch to zoom</p>
                <p>• Double tap to reset</p>
            </div>
        </div>
        
        <div id="mobile-controls">
            <div class="mobile-btn" id="mobile-reset">Reset</div>
            <div class="mobile-btn" id="mobile-random">Random</div>
            <div class="mobile-btn" id="mobile-solve">Solve</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
